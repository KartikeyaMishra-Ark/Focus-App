<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-App</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <div>
            <input type="text" id="task-input">
            <button id="task-btn">Add Task</button>


        </div>

        <ul id="task-list">

        </ul>

        


    </div>

    <div id="pomodoro">
        <h2>Pomodoro</h2>
        <div id="timer">

            25:00

        </div>
        <button id="start-btn">Start</button>
        <button id="reset-btn">Reset</button>



    </div>


    <div id="WeatherDisplay">
        <h2>Weather</h2>
        <div class="search">
            <input type="text" id="city-input" placeholder="Enter a city">
            <button id="weather-btn">Search</button>


        </div>
        <h3 id="city-name">to be entered</h3>
        <div id="temperature">to be entered</div>
        <p id="conidtion">to be entered</p>

        <div class="weather-details">
            <p>Humidity: <span id="Humidity">to be entered</span>%</p>
            <p>Wind: <span id="Wind">to be entered</span> kmph</p>

        </div>

        <p id="weather-error"></p>

        



    </div>
    
</body>
<script src="script.js"></script>
</html>
